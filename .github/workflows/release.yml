name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish @keyoku/types
        run: npm publish --workspace packages/types --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @keyoku/memory
        run: npm publish --workspace packages/memory --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @keyoku/openclaw
        run: npm publish --workspace packages/openclaw --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Trigger keyoku-git deploy
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.KEYOKU_GIT_WORKFLOW_TOKEN }}
        run: |
          set -eu

          version="${GITHUB_REF_NAME#v}"
          echo "Release publish succeeded; triggering keyoku-git Deploy to VPS for @keyoku/openclaw ${version}."

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/Keyoku-ai/keyoku-git/actions/workflows/deploy.yml/dispatches" \
            -f ref=main \
            -f inputs[expected_keyoku_openclaw_version]="$version"
