name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Idempotent: a version already on npm (e.g. published from a maintainer's
      # CLI) is skipped instead of hard-failing the release. With NPM_TOKEN set
      # (or npm Trusted Publishing configured) CI publishes new versions with
      # provenance; without it, this step no-ops on already-published versions.
      - name: Publish to npm (skip if version already published)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "keyoku@${VERSION}" version >/dev/null 2>&1; then
            echo "keyoku@${VERSION} is already on npm — skipping publish."
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
